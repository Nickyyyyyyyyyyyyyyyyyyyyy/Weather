<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Weather UI</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
</head>
<body>
  <div class="background"></div>
  
  <div class="weather-container">
    <div class="current-weather">
      <div class="city" id="city">Kyiv</div>
      <div class="current-details">
        <i id="weather-icon" class="wi"></i>
        <div class="temp" id="temperature">--°</div>
      </div>
      <div class="description" id="description">Завантаження...</div>
    </div>
    <div class="forecast">
      <h2>Прогноз</h2>
      <div class="forecast-container" id="forecast-container"></div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
