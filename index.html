<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоди</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background"></div>
    <header>
        <h1>Прогноз погоди</h1>
    </header>
    <main>
        <section id="search">
            <input type="text" id="cityInput" placeholder="Введіть назву міста">
            <button id="getWeather">Отримати погоду</button>
        </section>
        <section id="currentWeather"></section>
        <section id="hourlyForecast">
            <h3>Погодинний прогноз</h3>
            <div id="hourlyWeather"></div>
        </section>
        <section id="dailyForecast">
            <h3>10-денний прогноз</h3>
            <div id="dailyWeather"></div>
        </section>
    </main>
    <footer>
        <p>© 2025 Прогноз погоди</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
