<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Weather Style</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Підключення Weather Icons для відображення погодних іконок -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
</head>
<body>
  <!-- Фон, який змінюється динамічно залежно від погоди -->
  <div class="background"></div>
  
  <!-- Контейнер з інформацією про погоду -->
  <div class="weather-container">
      <div class="city" id="city">Kyiv</div>
      <div class="weather-icon">
          <i id="weather-icon" class="wi wi-day-sunny"></i>
      </div>
      <div class="temperature" id="temperature">--°</div>
      <div class="description" id="description">Завантаження...</div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
